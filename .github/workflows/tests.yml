name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run unit tests
        run: make test
      - name: Check the Xcode project builds
        run: xcodebuild -project RightShortcuts.xcodeproj -scheme "Right Shortcuts" -configuration Release -destination "generic/platform=macOS" CODE_SIGNING_ALLOWED=NO build
